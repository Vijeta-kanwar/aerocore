# Non-secret runtime settings. Every key here is consumed via envFrom in the
# Deployment — nothing in this file is decorative.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aerocore-app-config
  labels:
    app.kubernetes.io/name: aerocore
    app.kubernetes.io/component: backend
data:

  DB_URL: jdbc:postgresql://aerocore-db:5432/aerocore
  SPRING_PROFILES_ACTIVE: kubernetes
  JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -XX:+UseContainerSupport"
  LOGGING_LEVEL_COM_AIRTICKET: INFO
