# Everything applies with a single command: kubectl apply -k k8s/
# CI rewrites the image tag with: kustomize edit set image aerocore-app=...
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aerocore

resources:
  - namespace.yaml
  - postgres/secret.yaml
  - postgres/service.yaml
  - postgres/statefulset.yaml
  - app/configmap.yaml
  - app/deployment.yaml
  - app/service.yaml
  - app/hpa.yaml

commonLabels:
  app.kubernetes.io/part-of: aerocore

images:
  - name: ghcr.io/vijeta-kanwar/aerocore
    newTag: latest
