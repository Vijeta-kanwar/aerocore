# Headless service: gives the StatefulSet pod a stable DNS name
# (aerocore-db-0.aerocore-db.aerocore.svc.cluster.local).
apiVersion: v1
kind: Service
metadata:
  name: aerocore-db
  labels:
    app.kubernetes.io/name: aerocore
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: aerocore
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
