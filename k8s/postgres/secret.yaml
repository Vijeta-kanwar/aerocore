# Demo credentials, committed so the project runs from a clean clone.
# In a real cluster this file would be replaced by Sealed Secrets or External
# Secrets Operator and never live in Git. Called out here rather than pretending
# otherwise.
apiVersion: v1
kind: Secret
metadata:
  name: aerocore-db-credentials
  labels:
    app.kubernetes.io/name: aerocore
    app.kubernetes.io/component: database
type: Opaque
stringData:
  POSTGRES_DB: aerocore
  POSTGRES_USER: aerocore
  POSTGRES_PASSWORD: change-me-in-a-real-cluster
