name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Compile, test and measure coverage
        run: mvn -B verify

      # Renders pass/fail per test in the Actions summary, so a reviewer does not
      # have to open the raw log to see what was checked.
      - name: Publish test report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: target/surefire-reports/TEST-*.xml
          check_name: Unit tests

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage
          path: target/site/jacoco/
          retention-days: 7

  smoke:
    name: Smoke test the running stack
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      # Proves the image builds, Flyway migrates a real Postgres, and the API
      # answers — the things a unit test cannot tell you.
      - name: Start the stack
        run: docker compose up --build -d

      - name: Wait for the app to report ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health/readiness > /dev/null 2>&1; then
              echo "ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "app never became ready"
          docker compose logs app
          exit 1

      - name: Seeded schedule is queryable
        run: |
          count=$(curl -fsS http://localhost:8080/api/flights | jq 'length')
          echo "flights returned: $count"
          test "$count" -ge 1

      # Authentication must actually be enforced.
      - name: Unauthenticated booking is rejected with 401
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/bookings \
            -H 'Content-Type: application/json' \
            -d '{"flightId":1,"passengerName":"CI Smoke","passengerEmail":"ci@example.com","passengerPhone":"9999999999","seatsBooked":2}')
          echo "got $status"
          test "$status" = "401"

      - name: Register smoke test user
        run: |
          curl -fsS -X POST http://localhost:8080/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@aerocore.test","password":"smoke-test-password","fullName":"Smoke Test"}'

      - name: Login smoke test user
        run: |
          TOKEN=$(curl -fsS -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@aerocore.test","password":"smoke-test-password"}' \
            | jq -r '.token')

          test -n "$TOKEN"
          test "$TOKEN" != "null"
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Booking reserves a seat and the count goes down
        run: |
          before=$(curl -fsS http://localhost:8080/api/flights/1 | jq '.availableSeats')

          curl -fsS -X POST http://localhost:8080/api/bookings \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $TOKEN" \
            -H "Idempotency-Key: $(uuidgen)" \
            -d '{"flightId":1,"passengerName":"CI Smoke","passengerEmail":"ci@example.com","passengerPhone":"9999999999","seatsBooked":2}' \
            | jq -e '.reference and .status == "CONFIRMED"'

          after=$(curl -fsS http://localhost:8080/api/flights/1 | jq '.availableSeats')
          echo "seats: $before -> $after"
          test "$after" -eq "$((before - 2))"

      - name: Overbooking is rejected with 409, not 500
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/bookings \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $TOKEN" \
            -H "Idempotency-Key: $(uuidgen)" \
            -d '{"flightId":1,"passengerName":"CI Smoke","passengerEmail":"ci@example.com","passengerPhone":"9999999999","seatsBooked":9999}')
          echo "got $status"
          test "$status" = "400" -o "$status" = "409"

      - name: Invalid email is rejected with 400
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/bookings \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $TOKEN" \
            -H "Idempotency-Key: $(uuidgen)" \
            -d '{"flightId":1,"passengerName":"CI Smoke","passengerEmail":"nope","passengerPhone":"9999999999","seatsBooked":1}')
          test "$status" = "400"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: [test, smoke]
    # Only main publishes; pull requests stop after the checks above.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      # GITHUB_TOKEN is enough to push to this repo's package registry,
      # so the pipeline needs no manually configured registry credentials.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
