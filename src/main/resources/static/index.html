<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AeroCore — flight search and booking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:      #0A1A2B;
    --ink-soft: #16324A;
    --slate:    #5A6B7C;
    --paper:    #E7EBEF;
    --card:     #FFFFFF;
    --amber:    #E4A11B;
    --line:     #D2DAE1;
    --ok:       #15764F;
    --alert:    #B42318;

    --sans: 'Archivo', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;

    --radius: 10px;
    --gutter: 20px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  :focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 2px;
  }

  .wrap {
    max-width: 940px;
    margin: 0 auto;
    padding: 0 var(--gutter);
  }

  /* ---------- masthead ---------- */

  .masthead {
    background: var(--ink);
    color: #fff;
    padding: 18px 0;
  }

  .masthead-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-weight: 700;
    font-size: 19px;
    letter-spacing: -0.01em;
  }

  .brand span {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 400;
    color: var(--amber);
    letter-spacing: 0.08em;
  }

  .tabs {
    display: flex;
    gap: 4px;
  }

  .tab {
    appearance: none;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.18);
    color: rgba(255,255,255,0.72);
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }

  .tab:hover { color: #fff; border-color: rgba(255,255,255,0.4); }

  .tab[aria-selected="true"] {
    background: var(--amber);
    border-color: var(--amber);
    color: var(--ink);
  }

  /* ---------- search rail ---------- */

  .rail {
    background: var(--ink-soft);
    padding: 20px 0 24px;
  }

  .rail form {
    display: grid;
    grid-template-columns: 1fr auto 1fr auto;
    gap: 10px;
    align-items: end;
  }

  .field label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.6);
    margin-bottom: 5px;
  }

  .field input,
  .field select {
    width: 100%;
    height: 42px;
    padding: 0 12px;
    background: #fff;
    border: 1px solid transparent;
    border-radius: 8px;
    font-family: var(--sans);
    font-size: 15px;
    color: var(--ink);
  }

  .swap {
    height: 42px;
    width: 42px;
    border: 1px solid rgba(255,255,255,0.25);
    background: transparent;
    color: #fff;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
  }

  .swap:hover { border-color: var(--amber); color: var(--amber); }

  .btn {
    appearance: none;
    height: 42px;
    padding: 0 22px;
    border: 0;
    border-radius: 8px;
    background: var(--amber);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: filter 0.15s;
  }

  .btn:hover { filter: brightness(1.06); }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; }

  .btn-ghost {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--slate);
    font-weight: 500;
  }

  .btn-ghost:hover { border-color: var(--slate); color: var(--ink); }

  .btn-danger {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--alert);
    font-weight: 500;
  }

  .btn-danger:hover { border-color: var(--alert); }

  .btn-sm { height: 34px; padding: 0 14px; font-size: 13px; }

  /* ---------- results ---------- */

  main { padding: 26px 0 60px; }

  .results-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .results-head h2 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
  }

  .count {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--slate);
  }

  /* The signature: each flight is a boarding pass with a torn-off stub. */
  .pass {
    display: grid;
    grid-template-columns: 1fr 168px;
    background: var(--card);
    border-radius: var(--radius);
    margin-bottom: 12px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(10,26,43,0.06), 0 4px 14px rgba(10,26,43,0.05);
  }

  .pass-body { padding: 18px 20px; }

  .pass-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  .code {
    font-family: var(--mono);
    font-weight: 600;
    font-size: 13px;
    color: var(--ink);
    background: var(--paper);
    padding: 3px 8px;
    border-radius: 4px;
  }

  .airline { font-size: 13px; color: var(--slate); }

  .leg {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 14px;
  }

  .port { text-align: center; }

  .port .iata {
    font-family: var(--mono);
    font-size: 25px;
    font-weight: 600;
    letter-spacing: 0.02em;
    line-height: 1.1;
  }

  .port .time {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--slate);
    margin-top: 2px;
  }

  .port .city {
    font-size: 11px;
    color: var(--slate);
    margin-top: 1px;
  }

  .arc { text-align: center; position: relative; }

  .arc .dur {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--slate);
    margin-bottom: 4px;
  }

  .arc .track {
    height: 1px;
    background: var(--line);
    position: relative;
  }

  .arc .track::after {
    content: "✈";
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: var(--card);
    padding: 0 7px;
    font-size: 12px;
    color: var(--amber);
  }

  /* the perforation */
  .stub {
    border-left: 1px dashed var(--line);
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 6px;
  }

  .pass::before,
  .pass::after {
    content: "";
    position: absolute;
    right: 157px;
    width: 22px;
    height: 22px;
    background: var(--paper);
    border-radius: 50%;
  }

  .pass::before { top: -11px; }
  .pass::after  { bottom: -11px; }

  .fare {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 600;
  }

  .fare-note {
    font-size: 11px;
    color: var(--slate);
    margin-top: -4px;
  }

  .seats {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--slate);
  }

  .seats.low { color: var(--alert); font-weight: 600; }

  /* ---------- booking rows ---------- */

  .row {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    box-shadow: 0 1px 2px rgba(10,26,43,0.06);
  }

  .row-main { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

  .ref {
    font-family: var(--mono);
    font-weight: 600;
    font-size: 14px;
    color: var(--ink);
  }

  .row-meta { font-size: 13px; color: var(--slate); }

  .pill {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    padding: 3px 8px;
    border-radius: 999px;
    text-transform: uppercase;
  }

  .pill.confirmed { background: rgba(21,118,79,0.1); color: var(--ok); }
  .pill.cancelled { background: rgba(180,35,24,0.09); color: var(--alert); }

  /* ---------- states ---------- */

  .state {
    background: var(--card);
    border-radius: var(--radius);
    padding: 44px 24px;
    text-align: center;
    color: var(--slate);
  }

  .state strong {
    display: block;
    color: var(--ink);
    font-size: 15px;
    margin-bottom: 5px;
  }

  .state.error {
    border-left: 3px solid var(--alert);
    text-align: left;
    padding: 18px 20px;
  }

  .state.error strong { color: var(--alert); }

  .skeleton {
    height: 104px;
    border-radius: var(--radius);
    margin-bottom: 12px;
    background: linear-gradient(100deg, #fff 30%, #F1F4F7 50%, #fff 70%);
    background-size: 220% 100%;
    animation: sweep 1.1s linear infinite;
  }

  @keyframes sweep { to { background-position: -220% 0; } }

  /* ---------- lookup bar ---------- */

  .lookup {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .lookup input {
    flex: 1 1 240px;
    height: 42px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: var(--sans);
    font-size: 15px;
    background: #fff;
  }

  /* ---------- dialog ---------- */

  dialog {
    border: 0;
    border-radius: 14px;
    padding: 0;
    width: min(430px, calc(100vw - 32px));
    box-shadow: 0 24px 60px rgba(10,26,43,0.3);
  }

  dialog::backdrop { background: rgba(10,26,43,0.55); }

  .dialog-head {
    padding: 18px 22px;
    border-bottom: 1px solid var(--line);
  }

  .dialog-head h3 { margin: 0 0 3px; font-size: 16px; }
  .dialog-head p  { margin: 0; font-size: 13px; color: var(--slate); }

  .dialog-body { padding: 20px 22px; }

  .dialog-body label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--slate);
    margin: 0 0 5px;
  }

  .dialog-body input,
  .dialog-body select {
    width: 100%;
    height: 40px;
    padding: 0 11px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: var(--sans);
    font-size: 15px;
    margin-bottom: 14px;
    background: #fff;
    color: var(--ink);
  }

  .total {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 12px 0 4px;
    border-top: 1px solid var(--line);
    margin-bottom: 14px;
  }

  .total span { font-size: 13px; color: var(--slate); }
  .total strong { font-family: var(--mono); font-size: 20px; }

  .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; }

  .form-error {
    background: rgba(180,35,24,0.07);
    border-left: 3px solid var(--alert);
    color: var(--alert);
    font-size: 13px;
    padding: 9px 12px;
    border-radius: 4px;
    margin-bottom: 14px;
  }

  /* ---------- confirmation ---------- */

  .confirm { text-align: center; padding: 8px 0 4px; }
  .confirm .tick { font-size: 30px; color: var(--ok); }
  .confirm h4 { margin: 8px 0 4px; font-size: 16px; }
  .confirm p  { margin: 0 0 14px; font-size: 13px; color: var(--slate); }

  .confirm .ref-big {
    font-family: var(--mono);
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 0.04em;
    background: var(--paper);
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 16px;
  }

  /* ---------- footer ---------- */

  footer {
    border-top: 1px solid var(--line);
    padding: 18px 0 30px;
    font-size: 12px;
    color: var(--slate);
  }

  footer a { color: var(--slate); }

  .hidden { display: none !important; }

  @media (max-width: 720px) {
    .rail form { grid-template-columns: 1fr; }
    .swap { width: 100%; }
    .pass { grid-template-columns: 1fr; }
    .stub {
      border-left: 0;
      border-top: 1px dashed var(--line);
      flex-direction: row;
      justify-content: space-between;
      gap: 12px;
    }
    .pass::before, .pass::after { display: none; }
    .port .iata { font-size: 21px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap masthead-inner">
    <div class="brand">AeroCore <span>BOOKING SYSTEM</span></div>
    <nav class="tabs" role="tablist">
      <button class="tab" id="tab-search"   role="tab" aria-selected="true"  aria-controls="panel-search">Find flights</button>
      <button class="tab" id="tab-bookings" role="tab" aria-selected="false" aria-controls="panel-bookings">My bookings</button>
    </nav>
  </div>
</header>

<section class="rail" id="rail">
  <div class="wrap">
    <form id="search-form">
      <div class="field">
        <label for="origin">From</label>
        <input id="origin" name="origin" list="cities" placeholder="Delhi" autocomplete="off" required>
      </div>
      <button type="button" class="swap" id="swap" title="Swap origin and destination" aria-label="Swap origin and destination">⇄</button>
      <div class="field">
        <label for="destination">To</label>
        <input id="destination" name="destination" list="cities" placeholder="Mumbai" autocomplete="off" required>
      </div>
      <button type="submit" class="btn" id="search-btn">Search</button>
    </form>
    <datalist id="cities"></datalist>
  </div>
</section>

<main class="wrap">

  <div id="panel-search" role="tabpanel" aria-labelledby="tab-search">
    <div class="results-head">
      <h2 id="results-title">Every scheduled flight</h2>
      <span class="count" id="results-count"></span>
    </div>
    <div id="results"></div>
  </div>

  <div id="panel-bookings" role="tabpanel" aria-labelledby="tab-bookings" class="hidden">
    <div class="results-head">
      <h2>Look up a booking</h2>
    </div>
    <div class="lookup">
      <input id="lookup-email" type="email" placeholder="The email you booked with" autocomplete="email">
      <button class="btn" id="lookup-btn">Find bookings</button>
    </div>
    <div id="bookings"></div>
  </div>

</main>

<footer class="wrap">
  Spring Boot &middot; PostgreSQL &middot; Docker &middot; Kubernetes &nbsp;|&nbsp;
  <a href="/swagger-ui.html">API reference</a> &middot;
  <a href="/actuator/health">Health</a>
</footer>

<dialog id="book-dialog">
  <form id="book-form" method="dialog">
    <div class="dialog-head">
      <h3 id="dialog-title">Book a seat</h3>
      <p id="dialog-sub"></p>
    </div>
    <div class="dialog-body" id="dialog-body">
      <div class="form-error hidden" id="form-error"></div>

      <label for="p-name">Passenger name</label>
      <input id="p-name" required minlength="2" maxlength="120" autocomplete="name">

      <label for="p-email">Email</label>
      <input id="p-email" type="email" required autocomplete="email">

      <label for="p-phone">Phone</label>
      <input id="p-phone" required pattern="[0-9+\-\s]{7,20}" autocomplete="tel">

      <label for="p-seats">Seats</label>
      <select id="p-seats"></select>

      <div class="total">
        <span>Total</span>
        <strong id="p-total">—</strong>
      </div>

      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" id="cancel-dialog">Back</button>
        <button type="submit" class="btn" id="confirm-btn">Confirm booking</button>
      </div>
    </div>
  </form>
</dialog>

<script>
(function () {
  "use strict";

  // Relative paths only. The page is served by the same Spring Boot app that
  // serves the API, so this works identically on localhost:8080, on a NodePort,
  // and behind an ingress — with no rebuild and no hardcoded host.
  const API = {
    flights:  "/api/flights",
    bookings: "/api/bookings"
  };

  const IATA = {
    delhi: "DEL", mumbai: "BOM", bengaluru: "BLR", bangalore: "BLR",
    goa: "GOI", chennai: "MAA", kolkata: "CCU", jaipur: "JAI",
    hyderabad: "HYD", pune: "PNQ", ahmedabad: "AMD", kochi: "COK"
  };

  const rupees = new Intl.NumberFormat("en-IN", {
    style: "currency", currency: "INR", maximumFractionDigits: 0
  });

  const $ = (id) => document.getElementById(id);

  const el = {
    results:      $("results"),
    resultsTitle: $("results-title"),
    resultsCount: $("results-count"),
    bookings:     $("bookings"),
    searchForm:   $("search-form"),
    origin:       $("origin"),
    destination:  $("destination"),
    cities:       $("cities"),
    dialog:       $("book-dialog"),
    bookForm:     $("book-form"),
    formError:    $("form-error"),
    dialogSub:    $("dialog-sub"),
    dialogTitle:  $("dialog-title"),
    dialogBody:   $("dialog-body")
  };

  let selectedFlight = null;
  const dialogTemplate = el.dialogBody.innerHTML;

  // ---------- helpers ----------

  function iata(city) {
    if (!city) return "???";
    return IATA[city.trim().toLowerCase()] || city.trim().slice(0, 3).toUpperCase();
  }

  function duration(dep, arr) {
    const [dh, dm] = dep.split(":").map(Number);
    const [ah, am] = arr.split(":").map(Number);
    let mins = (ah * 60 + am) - (dh * 60 + dm);
    if (mins < 0) mins += 24 * 60;           // overnight leg
    return Math.floor(mins / 60) + "h " + String(mins % 60).padStart(2, "0") + "m";
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, (c) => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));
  }

  /**
   * Every failure path goes through here. The API returns a consistent error
   * shape, so the user sees what the server actually said instead of "failed".
   */
  async function request(url, options) {
    let response;
    try {
      response = await fetch(url, options);
    } catch (networkError) {
      throw new Error("Could not reach the server. Is the application running?");
    }

    if (response.status === 204) return null;

    const body = await response.json().catch(() => null);

    if (!response.ok) {
      if (body && body.fieldErrors) {
        throw new Error(Object.values(body.fieldErrors).join(". "));
      }
      throw new Error((body && body.message) || ("Request failed with status " + response.status));
    }
    return body;
  }

  function showState(target, title, detail, isError) {
    target.innerHTML =
      '<div class="state' + (isError ? " error" : "") + '">' +
        "<strong>" + escapeHtml(title) + "</strong>" +
        escapeHtml(detail) +
      "</div>";
  }

  function showSkeletons(target, n) {
    target.innerHTML = Array.from({ length: n }, () => '<div class="skeleton"></div>').join("");
  }

  // ---------- flights ----------

  function flightCard(flight) {
    const low = flight.availableSeats > 0 && flight.availableSeats <= 10;
    const soldOut = flight.availableSeats === 0;

    return '' +
      '<article class="pass">' +
        '<div class="pass-body">' +
          '<div class="pass-top">' +
            '<span class="code">' + escapeHtml(flight.flightNumber) + "</span>" +
            '<span class="airline">' + escapeHtml(flight.airline) + "</span>" +
          "</div>" +
          '<div class="leg">' +
            '<div class="port">' +
              '<div class="iata">' + iata(flight.origin) + "</div>" +
              '<div class="time">' + escapeHtml(flight.departureTime) + "</div>" +
              '<div class="city">' + escapeHtml(flight.origin) + "</div>" +
            "</div>" +
            '<div class="arc">' +
              '<div class="dur">' + duration(flight.departureTime, flight.arrivalTime) + "</div>" +
              '<div class="track"></div>' +
            "</div>" +
            '<div class="port">' +
              '<div class="iata">' + iata(flight.destination) + "</div>" +
              '<div class="time">' + escapeHtml(flight.arrivalTime) + "</div>" +
              '<div class="city">' + escapeHtml(flight.destination) + "</div>" +
            "</div>" +
          "</div>" +
        "</div>" +
        '<div class="stub">' +
          '<div class="fare">' + rupees.format(flight.price) + "</div>" +
          '<div class="fare-note">per seat</div>' +
          '<button class="btn btn-sm" data-book="' + flight.id + '"' + (soldOut ? " disabled" : "") + ">" +
            (soldOut ? "Sold out" : "Book") +
          "</button>" +
          '<div class="seats' + (low ? " low" : "") + '">' +
            (soldOut ? "no seats left" : flight.availableSeats + " seats left") +
          "</div>" +
        "</div>" +
      "</article>";
  }

  function renderFlights(flights) {
    el.resultsCount.textContent = flights.length + (flights.length === 1 ? " flight" : " flights");

    if (!flights.length) {
      showState(el.results, "No flights on this route",
        "Try Delhi to Mumbai, or clear the fields to see the whole schedule.");
      return;
    }

    el.results.innerHTML = flights.map(flightCard).join("");
    el.results.querySelectorAll("[data-book]").forEach((button) => {
      button.addEventListener("click", () => {
        const flight = flights.find((f) => String(f.id) === button.dataset.book);
        if (flight) openDialog(flight);
      });
    });
  }

  async function loadAllFlights() {
    el.resultsTitle.textContent = "Every scheduled flight";
    el.resultsCount.textContent = "";
    showSkeletons(el.results, 4);
    try {
      const flights = await request(API.flights);
      renderFlights(flights);
      populateCities(flights);
    } catch (error) {
      showState(el.results, "Could not load the schedule", error.message, true);
    }
  }

  async function searchFlights(origin, destination) {
    el.resultsTitle.textContent = origin + " to " + destination;
    el.resultsCount.textContent = "";
    showSkeletons(el.results, 3);
    const query = "?origin=" + encodeURIComponent(origin) + "&destination=" + encodeURIComponent(destination);
    try {
      renderFlights(await request(API.flights + "/search" + query));
    } catch (error) {
      showState(el.results, "Search failed", error.message, true);
    }
  }

  function populateCities(flights) {
    const set = new Set();
    flights.forEach((f) => { set.add(f.origin); set.add(f.destination); });
    el.cities.innerHTML = [...set].sort()
      .map((c) => '<option value="' + escapeHtml(c) + '">').join("");
  }

  // ---------- booking dialog ----------

  function openDialog(flight) {
    selectedFlight = flight;
    el.dialogBody.innerHTML = dialogTemplate;
    rebindDialog();

    el.dialogTitle.textContent = "Book " + flight.flightNumber;
    el.dialogSub.textContent =
      flight.origin + " → " + flight.destination + " · " + flight.departureTime + " · " + flight.airline;

    const max = Math.min(flight.availableSeats, 9);
    const seats = $("p-seats");
    seats.innerHTML = Array.from({ length: max }, (_, i) =>
      "<option value=" + (i + 1) + ">" + (i + 1) + (i ? " seats" : " seat") + "</option>").join("");

    seats.addEventListener("change", updateTotal);
    updateTotal();
    el.dialog.showModal();
  }

  function updateTotal() {
    const seats = Number($("p-seats").value || 1);
    $("p-total").textContent = rupees.format(selectedFlight.price * seats);
  }

  function rebindDialog() {
    el.formError = $("form-error");
    $("cancel-dialog").addEventListener("click", () => el.dialog.close());
  }

  async function submitBooking(event) {
    event.preventDefault();

    const form = event.target;
    if (!form.checkValidity()) { form.reportValidity(); return; }

    const button = $("confirm-btn");
    button.disabled = true;
    button.textContent = "Booking…";
    el.formError.classList.add("hidden");

    const payload = {
      flightId:       selectedFlight.id,
      passengerName:  $("p-name").value.trim(),
      passengerEmail: $("p-email").value.trim(),
      passengerPhone: $("p-phone").value.trim(),
      seatsBooked:    Number($("p-seats").value)
    };

    try {
      const booking = await request(API.bookings, {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify(payload)
      });
      showConfirmation(booking);
      refreshCurrentView();
    } catch (error) {
      el.formError.textContent = error.message;
      el.formError.classList.remove("hidden");
      button.disabled = false;
      button.textContent = "Confirm booking";
    }
  }

  function showConfirmation(booking) {
    el.dialogTitle.textContent = "Seat reserved";
    el.dialogSub.textContent = booking.flightNumber + " · " + booking.origin + " → " + booking.destination;
    el.dialogBody.innerHTML =
      '<div class="confirm">' +
        '<div class="tick">✓</div>' +
        "<h4>Keep this reference</h4>" +
        "<p>Quote it at check-in, or use your email to find this booking again.</p>" +
        '<div class="ref-big">' + escapeHtml(booking.reference) + "</div>" +
        '<div class="dialog-actions" style="justify-content:center">' +
          '<button type="button" class="btn" id="done-btn">Done</button>' +
        "</div>" +
      "</div>";
    $("done-btn").addEventListener("click", () => el.dialog.close());
  }

  // ---------- my bookings ----------

  function bookingRow(booking) {
    const cancelled = booking.status === "CANCELLED";
    return '' +
      '<div class="row">' +
        '<div class="row-main">' +
          '<span class="ref">' + escapeHtml(booking.reference) + "</span>" +
          '<span class="pill ' + (cancelled ? "cancelled" : "confirmed") + '">' +
            escapeHtml(booking.status) + "</span>" +
          '<span class="row-meta">' +
            escapeHtml(booking.flightNumber) + " · " +
            escapeHtml(booking.origin) + " → " + escapeHtml(booking.destination) + " · " +
            booking.seatsBooked + (booking.seatsBooked === 1 ? " seat · " : " seats · ") +
            rupees.format(booking.totalAmount) +
          "</span>" +
        "</div>" +
        (cancelled ? "" :
          '<button class="btn btn-sm btn-danger" data-cancel="' + booking.id + '">Cancel booking</button>') +
      "</div>";
  }

  async function loadBookings() {
    const email = $("lookup-email").value.trim();
    if (!email) {
      showState(el.bookings, "Enter your email", "Bookings are found using the email you booked with.");
      return;
    }

    showSkeletons(el.bookings, 2);
    try {
      const bookings = await request(API.bookings + "/passenger?email=" + encodeURIComponent(email));
      if (!bookings.length) {
        showState(el.bookings, "Nothing booked with this email", "Check the spelling, or book a flight first.");
        return;
      }
      el.bookings.innerHTML = bookings.map(bookingRow).join("");
      el.bookings.querySelectorAll("[data-cancel]").forEach((button) => {
        button.addEventListener("click", () => cancelBooking(button));
      });
    } catch (error) {
      showState(el.bookings, "Could not load bookings", error.message, true);
    }
  }

  async function cancelBooking(button) {
    button.disabled = true;
    button.textContent = "Cancelling…";
    try {
      await request(API.bookings + "/" + button.dataset.cancel + "/cancel", { method: "POST" });
      loadBookings();
    } catch (error) {
      button.disabled = false;
      button.textContent = "Cancel booking";
      showState(el.bookings, "Could not cancel", error.message, true);
    }
  }

  // ---------- tabs ----------

  function switchTab(name) {
    const searching = name === "search";
    $("tab-search").setAttribute("aria-selected", String(searching));
    $("tab-bookings").setAttribute("aria-selected", String(!searching));
    $("panel-search").classList.toggle("hidden", !searching);
    $("panel-bookings").classList.toggle("hidden", searching);
    $("rail").classList.toggle("hidden", !searching);

    if (!searching && !el.bookings.innerHTML) {
      showState(el.bookings, "Enter your email", "Bookings are found using the email you booked with.");
    }
  }

  function refreshCurrentView() {
    if ($("panel-search").classList.contains("hidden")) loadBookings();
    else if (el.origin.value.trim() && el.destination.value.trim()) {
      searchFlights(el.origin.value.trim(), el.destination.value.trim());
    } else loadAllFlights();
  }

  // ---------- wiring ----------

  el.searchForm.addEventListener("submit", (event) => {
    event.preventDefault();
    const origin = el.origin.value.trim();
    const destination = el.destination.value.trim();
    if (origin && destination) searchFlights(origin, destination);
    else loadAllFlights();
  });

  $("swap").addEventListener("click", () => {
    const held = el.origin.value;
    el.origin.value = el.destination.value;
    el.destination.value = held;
  });

  $("tab-search").addEventListener("click", () => switchTab("search"));
  $("tab-bookings").addEventListener("click", () => switchTab("bookings"));
  $("lookup-btn").addEventListener("click", loadBookings);
  $("lookup-email").addEventListener("keydown", (e) => { if (e.key === "Enter") loadBookings(); });
  el.bookForm.addEventListener("submit", submitBooking);

  loadAllFlights();
})();
</script>
</body>
</html>
