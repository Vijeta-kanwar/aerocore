<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AeroCore — flight search and booking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="masthead">
  <div class="wrap masthead-inner">
    <div class="brand">AeroCore <span>BOOKING SYSTEM</span></div>
    <nav class="tabs" role="tablist">
      <button class="tab" id="tab-search"   role="tab" aria-selected="true"  aria-controls="panel-search">Find flights</button>
      <button class="tab" id="tab-bookings" role="tab" aria-selected="false" aria-controls="panel-bookings">My bookings</button>
    </nav>
    <div class="account" id="account">
      <span class="who" id="account-email"></span>
      <button class="tab" id="sign-out">Sign out</button>
      <button class="tab" id="sign-in">Sign in</button>
    </div>
  </div>
</header>

<section class="rail" id="rail">
  <div class="wrap">
    <form id="search-form">
      <div class="field">
        <label for="origin">From</label>
        <input id="origin" name="origin" list="cities" placeholder="Delhi" autocomplete="off" required>
      </div>
      <button type="button" class="swap" id="swap" title="Swap origin and destination" aria-label="Swap origin and destination">⇄</button>
      <div class="field">
        <label for="destination">To</label>
        <input id="destination" name="destination" list="cities" placeholder="Mumbai" autocomplete="off" required>
      </div>
      <button type="submit" class="btn" id="search-btn">Search</button>
    </form>
    <datalist id="cities"></datalist>
  </div>
</section>

<main class="wrap">

  <div id="panel-search" role="tabpanel" aria-labelledby="tab-search">
    <div class="results-head">
      <h2 id="results-title">Every scheduled flight</h2>
      <span class="count" id="results-count"></span>
    </div>
    <div id="results"></div>
  </div>

  <div id="panel-bookings" role="tabpanel" aria-labelledby="tab-bookings" class="hidden">
    <div class="results-head">
      <h2>Your bookings</h2>
    </div>
    <div id="bookings"></div>
  </div>

</main>

<footer class="wrap">
  Spring Boot &middot; PostgreSQL &middot; Docker &middot; Kubernetes &nbsp;|&nbsp;
  <a href="/swagger-ui.html">API reference</a> &middot;
  <a href="/actuator/health">Health</a>
</footer>

<!-- Booking form. Only ever opened when signed in. -->
<dialog id="book-dialog">
  <form id="book-form" method="dialog">
    <div class="dialog-head">
      <h3 id="dialog-title">Book a seat</h3>
      <p id="dialog-sub"></p>
    </div>
    <div class="dialog-body" id="dialog-body">
      <div class="form-error hidden" id="form-error"></div>

      <label for="p-name">Passenger name</label>
      <input id="p-name" required minlength="2" maxlength="120" autocomplete="name">

      <label for="p-email">Email</label>
      <input id="p-email" type="email" required autocomplete="email">

      <label for="p-phone">Phone</label>
      <input id="p-phone" required pattern="[0-9+\-\s]{7,20}" autocomplete="tel">

      <label for="p-seats">Seats</label>
      <select id="p-seats"></select>

      <div class="total">
        <span>Total</span>
        <strong id="p-total">—</strong>
      </div>

      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" id="cancel-dialog">Back</button>
        <button type="submit" class="btn" id="confirm-btn">Confirm booking</button>
      </div>
    </div>
  </form>
</dialog>

<!-- Sign in / register. One dialog, two modes, because the fields barely differ. -->
<dialog id="auth-dialog">
  <form id="auth-form" method="dialog">
    <div class="dialog-head">
      <h3 id="auth-title">Sign in</h3>
      <p id="auth-sub">Bookings are tied to your account.</p>
    </div>
    <div class="dialog-body">
      <div class="form-error hidden" id="auth-error"></div>

      <div id="name-field" class="hidden">
        <label for="a-name">Full name</label>
        <input id="a-name" minlength="2" maxlength="120" autocomplete="name">
      </div>

      <label for="a-email">Email</label>
      <input id="a-email" type="email" required autocomplete="email">

      <label for="a-password">Password</label>
      <input id="a-password" type="password" required minlength="10" autocomplete="current-password">

      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" id="auth-switch">Create an account</button>
        <button type="submit" class="btn" id="auth-submit">Sign in</button>
      </div>
    </div>
  </form>
</dialog>

<script src="/auth.js"></script>
<script src="/app.js"></script>
</body>
</html>
