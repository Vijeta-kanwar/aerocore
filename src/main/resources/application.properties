spring.application.name=aerocore
server.port=8080

# Connection details come from the environment: docker-compose sets them locally,
# a Kubernetes Secret sets them in-cluster. Nothing sensitive is committed.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aerocore}
spring.datasource.username=${DB_USERNAME:aerocore}
spring.datasource.password=${DB_PASSWORD:aerocore}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Liveness and readiness are separate on purpose: a pod that has lost its database
# is not ready for traffic, but it should not be killed and restarted either.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.level.com.aerocore=INFO
