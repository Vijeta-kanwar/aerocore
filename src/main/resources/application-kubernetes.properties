# Activated by the ConfigMap in k8s/app/configmap.yaml.
# Quieter logs and a connection pool sized for a pod's CPU limit rather than a laptop's.
spring.jpa.show-sql=false
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

# Flyway must not run concurrently from three replicas racing each other; it takes
# a Postgres advisory lock, and this gives a slow starter time to wait for it.
spring.flyway.lock-retry-count=20

management.endpoint.health.show-details=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s
