# One command to run the whole system locally: docker compose up --build
# The app waits for Postgres to pass its own healthcheck before starting.

services:
  db:
    image: postgres:16-alpine
    container_name: airticket-db
    environment:
      POSTGRES_DB: airticket
      POSTGRES_USER: airticket
      POSTGRES_PASSWORD: airticket
    ports:
      - "5432:5432"
    volumes:
      - airticket-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airticket -d airticket"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
    container_name: airticket-app
    environment:
      DB_URL: jdbc:postgresql://db:5432/airticket
      DB_USERNAME: airticket
      DB_PASSWORD: airticket
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  airticket-db-data:
