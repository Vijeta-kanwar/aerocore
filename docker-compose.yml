# One command to run the whole system locally: docker compose up --build
# The app waits for Postgres to pass its own healthcheck before starting.

services:
  db:
    image: postgres:16-alpine
    container_name: aerocore-db
    environment:
      POSTGRES_DB: aerocore
      POSTGRES_USER: aerocore
      POSTGRES_PASSWORD: aerocore
    ports:
      - "5432:5432"
    volumes:
      - aerocore-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerocore -d aerocore"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
    container_name: aerocore-app
    environment:
      # Stub payment failure rates; keep disabled by default, override when testing.
      AEROCORE_PAYMENTS_DECLINE_RATE: "0.0"
      AEROCORE_PAYMENTS_TIMEOUT_RATE: "0.0"
      DB_URL: jdbc:postgresql://db:5432/aerocore
      DB_USERNAME: aerocore
      DB_PASSWORD: aerocore
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  aerocore-db-data:
